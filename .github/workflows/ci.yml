name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock

      - name: Install package and pinned dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install -c requirements-dev.lock -e ".[dev]"

      - name: Quality gate (lint, format, types, tests, coverage)
        shell: bash
        run: bash scripts/check.sh

  cli-smoke:
    name: CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install .

      - name: demo + check on the generated files
        shell: bash
        run: |
          set -euo pipefail
          quarantine-ledger demo --dir demo-out
          # The demo ledger contains one expired entry, so the gate must fail
          # with exit code 1 (findings), not 0 and not 2 (usage error).
          set +e
          quarantine-ledger check demo-out/quarantine.toml \
            --inventory demo-out/tests.json --today 2026-11-02
          status=$?
          set -e
          test "$status" -eq 1

      - name: demo refuses to overwrite
        shell: bash
        run: |
          set -euo pipefail
          set +e
          quarantine-ledger demo --dir demo-out
          status=$?
          set -e
          # Existing demo files must be preserved and reported as a usage error.
          test "$status" -eq 2
